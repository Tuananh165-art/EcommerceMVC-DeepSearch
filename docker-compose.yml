services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hshop-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      # Server đang có 1433 (SQL Server cũ) => dùng 1434 cho instance mới
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - hshop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hshop-web
    ports:
      # Server đang có 80/443 (nginx), 8081 (node) => 8080 an toàn
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hshop-net
    deploy:
      resources:
        limits:
          memory: 1G

  # Optional: nginx reverse proxy (bật nếu muốn trỏ domain vào app)
  # nginx:
  #   image: nginx:alpine
  #   container_name: hshop-nginx
  #   ports:
  #     - "8888:80"   # Dùng 8888 để tránh conflict với nginx host (port 80)
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - web
  #   restart: unless-stopped
  #   networks:
  #     - hshop-net

networks:
  hshop-net:
    driver: bridge

volumes:
  sqlserver_data:
